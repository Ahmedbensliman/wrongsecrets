name: DevSecOps Pipeline

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks scan (report only)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect \
            --source /repo --report-format sarif \
            --report-path /repo/gitleaks-report.sarif --exit-code 0

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.sarif
  build:
    runs-on: ubuntu-latest
    needs: gitleaks
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 26
          cache: maven

      - name: Build
        run: mvn -B package -DskipTests
  trivy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Trivy image scan (report only)
        run: |
          docker run --rm -v "$PWD:/out" aquasec/trivy:latest image \
            --severity HIGH,CRITICAL --format table \
            --output /out/trivy-report.txt \
            jeroenwillemsen/wrongsecrets:latest-no-vault
          cat trivy-report.txt

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt
  dependency-check:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: OWASP Dependency-Check (report only)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mkdir -p odc-reports && chmod 777 odc-reports
          docker run --rm -v "$PWD:/src" -v "$PWD/odc-reports:/report" \
            owasp/dependency-check:latest \
            --scan /src --format HTML --format JSON \
            --out /report --nvdApiKey "$NVD_API_KEY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: odc-reports/
