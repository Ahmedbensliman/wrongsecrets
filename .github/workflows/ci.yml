name: DevSecOps Pipeline

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  # 1) SECRETS SCAN (source code + git history)
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Report only. For a real Security Gate, change --exit-code 0 to --exit-code 1
      - name: Gitleaks scan (report only)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect \
            --source /repo --report-format sarif \
            --report-path /repo/gitleaks-report.sarif --exit-code 0

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.sarif

  # 2) BUILD (.jar)
  build:
    runs-on: ubuntu-latest
    needs: gitleaks
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 26
          cache: maven

      # The Dependency-Check Maven plugin is skipped here: SCA is done in its own job
      - name: Build
        run: mvn -B package -DskipTests -Ddependency-check.skip=true

  # 3) IMAGE SCAN
  trivy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      # Report only. For a real Security Gate, add: --exit-code 1
      - name: Trivy image scan (report only)
        run: |
          docker run --rm -v "$PWD:/out" aquasec/trivy:latest image \
            --severity HIGH,CRITICAL --format table \
            --output /out/trivy-report.txt \
            jeroenwillemsen/wrongsecrets:latest-no-vault
          cat trivy-report.txt

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt

  # 4) SCA (vulnerable libraries)
  dependency-check:
    runs-on: ubuntu-latest
    needs: build
    # Temporary: the scanner can crash when the NVD download breaks.
    # Remove this line when you turn the scan into a real Security Gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      # Keeps the NVD database between runs (the first download is very slow)
      - name: Cache Dependency-Check data
        uses: actions/cache@v4
        with:
          path: odc-data
          key: odc-data-${{ github.run_id }}
          restore-keys: odc-data-

      - name: OWASP Dependency-Check (report only)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mkdir -p odc-reports odc-data
          chmod -R 777 odc-reports odc-data
          docker run --rm \
            -v "$PWD:/src" \
            -v "$PWD/odc-reports:/report" \
            -v "$PWD/odc-data:/usr/share/dependency-check/data" \
            owasp/dependency-check:12.2.2 \
            --scan /src --format HTML --format JSON \
            --out /report --nvdApiKey "$NVD_API_KEY"
        # For a real Security Gate, add on the last line above:  --failOnCVSS 7

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: odc-reports/

  # 5) SAST (code analysis)
  sonarqube:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 26
          cache: maven

      - name: SonarQube Cloud scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B verify -DskipTests -Ddependency-check.skip=true \
            org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=Ahmedbensliman_wrongsecrets \
            -Dsonar.organization=ahmedbensliman \
            -Dsonar.host.url=https://sonarcloud.io
